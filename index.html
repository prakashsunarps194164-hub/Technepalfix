<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong Game</title>
    <style>
      :root {
        --bg-dark: #062d1d;
        --bg-panel: #0d3b2d;
        --line: #d0f9e5;
        --accent: #6ee7b7;
        --text: #f0fdf4;
        --canvas-green: #081f1a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at center, #0d3b2d, var(--bg-dark));
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .game-shell {
        background: rgba(13, 59, 45, 0.9);
        border: 2px solid rgba(110, 231, 183, 0.45);
        border-radius: 16px;
        padding: 20px 20px 12px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }

      .scoreboard {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        margin-bottom: 12px;
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--accent);
      }

      .scoreboard span {
        min-width: 50px;
        text-align: center;
      }

      #gameCanvas {
        display: block;
        width: min(82vw, 800px);
        height: auto;
        background: linear-gradient(180deg, var(--canvas-dark), #0d2e26);
        border: 2px solid var(--line);
        border-radius: 10px;
        box-shadow: inset 0 0 18px rgba(110, 231, 183, 0.18);
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="scoreboard">
        <span id="playerScore">0</span>
        <span>:</span>
        <span id="computerScore">0</span>
      </div>
      <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const playerScoreEl = document.getElementById('playerScore');
      const computerScoreEl = document.getElementById('computerScore');

      const playerPaddle = {
        x: 20,
        y: canvas.height / 2 - 60,
        width: 14,
        height: 120,
      };

      const computerPaddle = {
        x: canvas.width - 34,
        y: canvas.height / 2 - 60,
        width: 14,
        height: 120,
      };

      const ball = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 10,
        speed: 320,
        vx: 260,
        vy: 150,
      };

      const keys = {
        ArrowUp: false,
        ArrowDown: false,
      };

      let mouseY = null;
      let playerScore = 0;
      let computerScore = 0;

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function updateScore() {
        playerScoreEl.textContent = playerScore;
        computerScoreEl.textContent = computerScore;
      }

      function resetBall(direction = 1) {
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;

        const maxAngle = Math.PI / 3;
        const angle = (Math.random() * maxAngle) - maxAngle / 2;
        const baseSpeed = ball.speed + Math.random() * 40;

        ball.vx = Math.cos(angle) * baseSpeed * direction;
        ball.vy = Math.sin(angle) * baseSpeed;
      }

      function handlePlayerInput() {
        const moveUp = keys.ArrowUp ? -1 : 0;
        const moveDown = keys.ArrowDown ? 1 : 0;

        if (moveUp || moveDown) {
          playerPaddle.y += (moveUp + moveDown) * 420 * (1 / 60);
        } else if (mouseY !== null) {
          playerPaddle.y = mouseY - playerPaddle.height / 2;
        }

        playerPaddle.y = clamp(playerPaddle.y, 0, canvas.height - playerPaddle.height);
      }

      function moveComputer() {
        const paddleCenter = computerPaddle.y + computerPaddle.height / 2;
        const diff = ball.y - paddleCenter;
        const direction = Math.abs(diff) > 10 ? Math.sign(diff) : 0;
        computerPaddle.y += direction * 330 * (1 / 60);
        computerPaddle.y = clamp(computerPaddle.y, 0, canvas.height - computerPaddle.height);
      }

      function updateBall() {
        ball.x += ball.vx * (1 / 60);
        ball.y += ball.vy * (1 / 60);

        if (ball.y - ball.radius <= 0) {
          ball.y = ball.radius;
          ball.vy *= -1;
        }

        if (ball.y + ball.radius >= canvas.height) {
          ball.y = canvas.height - ball.radius;
          ball.vy *= -1;
        }

        const leftHit =
          ball.x - ball.radius <= playerPaddle.x + playerPaddle.width &&
          ball.x + ball.radius >= playerPaddle.x &&
          ball.y >= playerPaddle.y &&
          ball.y <= playerPaddle.y + playerPaddle.height;

        if (leftHit && ball.vx < 0) {
          const relativeIntersect =
            (ball.y - (playerPaddle.y + playerPaddle.height / 2)) /
            (playerPaddle.height / 2);

          const bounceAngle = relativeIntersect * (Math.PI / 3);
          const speed = Math.hypot(ball.vx, ball.vy) + 22;

          ball.x = playerPaddle.x + playerPaddle.width + ball.radius;
          ball.vx = Math.cos(bounceAngle) * speed;
          ball.vy = Math.sin(bounceAngle) * speed;
        }

        const rightHit =
          ball.x + ball.radius >= computerPaddle.x &&
          ball.x - ball.radius <= computerPaddle.x + computerPaddle.width &&
          ball.y >= computerPaddle.y &&
          ball.y <= computerPaddle.y + computerPaddle.height;

        if (rightHit && ball.vx > 0) {
          const relativeIntersect =
            (ball.y - (computerPaddle.y + computerPaddle.height / 2)) /
            (computerPaddle.height / 2);

          const bounceAngle = relativeIntersect * (Math.PI / 3);
          const speed = Math.hypot(ball.vx, ball.vy) + 18;

          ball.x = computerPaddle.x - ball.radius;
          ball.vx = -Math.cos(bounceAngle) * speed;
          ball.vy = Math.sin(bounceAngle) * speed;
        }

        if (ball.x < 0) {
          computerScore += 1;
          updateScore();
          resetBall(1);
        }

        if (ball.x > canvas.width) {
          playerScore += 1;
          updateScore();
          resetBall(-1);
        }
      }

      function drawField() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#081f1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#d0f9e5';
        ctx.lineWidth = 2;
        ctx.setLineDash([12, 12]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#f0fdf4';
        ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.width, playerPaddle.height);
        ctx.fillRect(computerPaddle.x, computerPaddle.y, computerPaddle.width, computerPaddle.height);

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#6ee7b7';
        ctx.fill();
      }

      function gameLoop() {
        handlePlayerInput();
        moveComputer();
        updateBall();
        drawField();
        requestAnimationFrame(gameLoop);
      }

      document.addEventListener('keydown', (event) => {
        if (event.key in keys) {
          keys[event.key] = true;
        }
      });

      document.addEventListener('keyup', (event) => {
        if (event.key in keys) {
          keys[event.key] = false;
        }
      });

      canvas.addEventListener('mousemove', (event) => {
        const rect = canvas.getBoundingClientRect();
        const relativeY = (event.clientY - rect.top) * (canvas.height / rect.height);
        mouseY = relativeY;
      });

      updateScore();
      resetBall(1);
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
